<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; img-src 'self' blob:; object-src 'none'; base-uri 'none'">
  <meta name="theme-color" content="#12332d">
  <title>SimpanIdea</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.7 4H7.3a2 2 0 0 0-1.8 1.1z"/></symbol>
    <symbol id="i-all" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h6"/></symbol>
    <symbol id="i-class" viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5z"/><path d="M6 12.5V17c3 2.7 9 2.7 12 0v-4.5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
    <symbol id="i-mark" viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></symbol>
  </svg>

  <div class="shell">
    <div id="scrim" class="scrim" hidden></div>

    <aside id="sidebar" class="sidebar" aria-label="Menu utama">
      <div class="brand">
        <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-mark"/></svg></span>
        <span class="brand-name">SimpanIdea</span>
        <button id="close-menu" class="icon-button on-dark" type="button" aria-label="Tutup menu">
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>

      <button id="add-side" class="add-button" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
        Tambah
      </button>

      <nav id="nav" class="nav"></nav>

      <div class="side-footer">
        <a class="nav-link" href="#settings" data-view="settings">
          <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>
          <span class="nav-label">Tetapan</span>
        </a>
        <p id="sync-status" class="sync-status" role="status"></p>
      </div>
    </aside>

    <div class="content">
      <header class="topbar">
        <button id="open-menu" class="icon-button" type="button" aria-label="Buka menu">
          <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
        </button>
        <h1 id="view-title" class="view-title"></h1>
        <label class="search">
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <span class="visually-hidden">Cari</span>
          <input id="search" type="search" placeholder="Cari tajuk, link atau nota" autocomplete="off">
        </label>
        <button id="refresh" class="icon-button" type="button" aria-label="Muat semula data">
          <svg class="icon" aria-hidden="true"><use href="#i-sync"/></svg>
        </button>
        <button id="add-top" class="primary-button" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
          <span>Tambah</span>
        </button>
      </header>

      <div id="banner" class="banner" role="alert" hidden></div>
      <main id="main" class="main"></main>
    </div>
  </div>

  <dialog id="composer" class="modal" aria-labelledby="composer-title">
    <form id="composer-form" method="dialog">
      <div class="modal-head">
        <h2 id="composer-title">Tambah ke Inbox</h2>
        <button class="icon-button" type="button" data-close aria-label="Tutup">
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
      <label for="composer-text" class="field-label">Link atau nota</label>
      <textarea id="composer-text" rows="4" placeholder="Tampal link, atau tulis idea kau"></textarea>
      <div class="modal-actions">
        <label class="ghost-button">
          <svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg>
          Pilih gambar
          <input id="picker" class="visually-hidden" type="file" accept="image/*" multiple>
        </label>
        <button id="composer-save" class="primary-button" type="submit">Simpan</button>
      </div>
    </form>
  </dialog>

  <dialog id="detail" class="panel" aria-labelledby="detail-title"></dialog>

  <div id="drop-overlay" class="drop-overlay" hidden>
    <svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg>
    Lepaskan gambar untuk simpan
  </div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
