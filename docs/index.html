<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; img-src 'self' blob: https://i.ytimg.com; frame-src https://www.youtube-nocookie.com https://www.tiktok.com https://www.facebook.com; object-src 'none'; base-uri 'none'">
  <meta name="theme-color" content="#f5f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12131b" media="(prefers-color-scheme: dark)">
  <title>SimpanIdea</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4.2 4.2 0 0 0 6 .2l3-3a4.3 4.3 0 0 0-6-6l-1.2 1.2"/><path d="M14 10a4.2 4.2 0 0 0-6-.2l-3 3a4.3 4.3 0 0 0 6 6l1.2-1.2"/></symbol>

    <symbol id="i-board" viewBox="0 0 24 24"><rect x="3.5" y="4" width="4.6" height="16" rx="1"/><rect x="9.7" y="4" width="4.6" height="10.5" rx="1"/><rect x="15.9" y="4" width="4.6" height="13.5" rx="1"/></symbol>
    <symbol id="i-class" viewBox="0 0 24 24"><path d="M12 5.5C9.6 4 6.8 3.6 3.5 4v14.5c3.3-.4 6.1 0 8.5 1.5 2.4-1.5 5.2-1.9 8.5-1.5V4c-3.3-.4-6.1 0-8.5 1.5z"/><path d="M12 5.5V20"/></symbol>

    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7.5h9M17.5 7.5H20M4 16.5h2.5M11 16.5h9"/><circle cx="15.2" cy="7.5" r="2.2"/><circle cx="8.8" cy="16.5" r="2.2"/></symbol>

    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14.5 4.5 10 9 5.5"/><path d="M4.5 10H14a5.5 5.5 0 0 1 0 11h-3"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M9 5H5v14h14v-4"/><path d="M13.5 4.5h6v6M19.5 4.5 11 13"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M15 9V5.5A1.5 1.5 0 0 0 13.5 4h-8A1.5 1.5 0 0 0 4 5.5v8A1.5 1.5 0 0 0 5.5 15H9"/></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5"/><path d="M20 4v4.5h-4.5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.5"/><path d="M4 20v-4.5h4.5"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4.5"/><path d="m7.5 9 4.5-4.5L16.5 9"/><path d="M4 15v4.5h16V15"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 7.5h3.5l1.7-2.5h5.6l1.7 2.5H20a1 1 0 0 1 1 1V18.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8.5a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="1.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M9.5 5.9A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a16 16 0 0 1-2.8 3.5"/><path d="M6 7.2A15.6 15.6 0 0 0 2.5 12S6 18.5 12 18.5a9.5 9.5 0 0 0 4.4-1.1"/><path d="M10 10a2.8 2.8 0 0 0 4 4"/><path d="m4 4 16 16"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><path d="m20 11.5-8.2 8.2a5 5 0 0 1-7-7l8.4-8.4a3.3 3.3 0 0 1 4.7 4.7l-8.4 8.4a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></symbol>

    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6.5h16"/><path d="M9.5 6.5V4.5h5v2"/><path d="M6 6.5 7 20h10l1-13.5"/><path d="M10 11v5M14 11v5"/></symbol>

    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.1"/><circle cx="12" cy="12" r="1.1"/><circle cx="18.5" cy="12" r="1.1"/></symbol>
  </svg>

  <div class="shell">
    <div id="scrim" class="scrim" hidden></div>

    <aside id="sidebar" class="sidebar" aria-label="Menu utama">
      <div class="brand">
        <span class="brand-name">Simpan<span>Idea</span></span>
        <button id="close-menu" class="icon-button" type="button" aria-label="Tutup menu">
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="side-foot side-lock">
        <p id="sync-status" class="sync-status" role="status"></p>
        <button id="lock-now" class="icon-button" type="button" aria-label="Kunci app sekarang" title="Kunci app" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>
        </button>
      </div>
    </aside>

    <div class="content">
      <header class="topbar">
        <button id="open-menu" class="icon-button" type="button" aria-label="Buka menu">
          <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
        </button>
        <div class="view-head">
          <span id="view-icon" class="view-icon"></span>
          <div class="view-text">
            <h1 id="view-title" class="view-title"></h1>
            <p id="view-sub" class="view-sub"></p>
          </div>
        </div>
        <label class="search">
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <span class="visually-hidden">Cari</span>
          <input id="search" type="search" placeholder="Cari semua" autocomplete="off">
        </label>
        <button id="ai-open" class="button ai-button" type="button" aria-label="Tanya AI">
          <svg class="icon" aria-hidden="true"><use href="#i-sparkle"/></svg>
          <span>Tanya AI</span>
        </button>
        <button id="refresh" class="icon-button" type="button" aria-label="Segerakkan dengan Google">
          <svg class="icon" aria-hidden="true"><use href="#i-sync"/></svg>
        </button>
        <button id="add" class="button primary" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
          <span>Tambah</span>
        </button>
      </header>

      <div id="banner" class="banner" role="alert" hidden></div>
      <main id="main" class="main"></main>
    </div>

    <nav id="tabs" class="tabs" aria-label="Pintasan"></nav>
  </div>

  <div id="drop-overlay" class="drop-overlay" hidden>Lepaskan gambar untuk simpan</div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="store.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
